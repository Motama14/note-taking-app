<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NoteIt</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400..700&family=Roboto:ital,wght@0,100..900;1,100..900&family=Share+Tech&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    
    <aside>

        <h1><span>Note</span>It®</h1>
        
        <div class="utility">
            <button id="new_note_button"><i class="fa-solid fa-plus"></i>New Note</button>
            <button id="new_task_button"><i class="fa-solid fa-plus"></i>New Task</button>
        </div>

        <div class="nav">
            <button id="show_note_button"><i class="fa-solid fa-note-sticky"></i>Notes</button>
            <button id="show_task_button"><i class="fa-solid fa-list-check"></i> Tasks</button>
        </div>
    </aside>

    <main>
        <div id="header"></div>
        <div id="note-container"></div>

    </main>

    <div id="show" class="invisible">
        <div id="show-container">
            <div id="show-title" contenteditable="true"></div>
            <div id="show-body" contenteditable="true"></div>
            <div id="show-tag"></div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script src="js/quotes.js"></script>
    <script src="js/time.js"></script>
    <script src="https://kit.fontawesome.com/135864cc21.js" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/masonry/4.2.2/masonry.pkgd.min.js"></script>
</body>
</html>
